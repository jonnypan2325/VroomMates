name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test frontend
        run: npm test -- --watchAll=false --passWithNoTests
        env:
          CI: "true"
      - name: Build frontend
        run: npm run build
        env:
          CI: "true"
          REACT_APP_GOOGLE_CLIENT_ID: ci-placeholder.apps.googleusercontent.com
          REACT_APP_GOOGLE_MAPS_API_KEY: ci-placeholder
          REACT_APP_FLASK_API_URL: http://127.0.0.1:5000

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -r requirements.txt -r requirements-test.txt
      - run: python -B -m tests.run_tests
